# Render blueprint: one free Docker web service, no external database required.
#
# 1. Push this project to GitHub.
# 2. Render Dashboard -> New -> Blueprint -> select the repository.
# 3. Click Apply. Render builds the Dockerfile and gives https://<name>.onrender.com.
#
# The "cloud" Spring profile runs an embedded H2 database and seeds the fictional demo
# data on every start, so there is nothing else to create or configure. The free tier
# has an ephemeral filesystem: data resets when the service restarts or redeploys, and
# the seeder recreates the demo dataset automatically.

services:
  - type: web
    name: women-safety
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: cloud
      - key: SEED_ENABLED
        value: "true"
      - key: DEMO_PASSWORD
        value: Demo@12345
      - key: JWT_SECRET
        generateValue: true
      - key: EVIDENCE_DIR
        value: /tmp/evidence
      - key: DISPLAY_TIME_ZONE
        value: Asia/Kolkata
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx256m -XX:MaxMetaspaceSize=160m"
