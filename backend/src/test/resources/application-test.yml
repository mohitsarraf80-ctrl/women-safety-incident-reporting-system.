spring:
  datasource:
    url: jdbc:h2:mem:women_safety_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

app:
  jwt:
    secret: test-only-secret-0123456789abcdef0123456789abcdef
    issuer: women-safety-platform-test
    access-token-ttl: PT1H
  storage:
    evidence-dir: ./target/test-evidence
  privacy:
    display-time-zone: Asia/Kolkata
  hotspot:
    reference-latitude: 28.5355
    cell-size-meters: 500
    window-days: 30
    top-k: 20
  security:
    rate-limit:
      login-per-minute: 200
      tracking-per-minute: 200
      report-per-minute: 200
      sos-per-minute: 200
  cors:
    allowed-origins: http://localhost:5173
  demo:
    seed-enabled: false

logging:
  level:
    org.hibernate: WARN
    org.springframework: WARN
    com.womensafety: INFO
