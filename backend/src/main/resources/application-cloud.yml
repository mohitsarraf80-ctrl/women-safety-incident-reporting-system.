# Self-contained demo profile for a free cloud host (Render/Railway/Fly).
#
# No external database is required: H2 runs in MySQL compatibility mode and stores
# its data in ./data/cloud-db. The schema is generated by Hibernate (Flyway is off
# because the production migration is MySQL-specific) and the demo seeder fills it.
#
# Free hosts usually have an ephemeral filesystem, so data can reset on redeploy or
# restart. The seeder then recreates the fictional demo dataset automatically.

spring:
  datasource:
    url: jdbc:h2:file:./data/cloud-db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
  flyway:
    enabled: false

app:
  demo:
    seed-enabled: true
  storage:
    evidence-dir: ./data/evidence

logging:
  level:
    org.hibernate: WARN
    org.flywaydb: WARN
