server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: women-safety-platform

  # Optional: a local backend/.env file (KEY=VALUE) is read automatically.
  # This keeps VS Code / terminal runs simple without exporting variables by hand.
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/women_safety?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:ws_user}
    password: ${DB_PASSWORD:change-me}
    hikari:
      pool-name: WomenSafetyPool
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  jwt:
    # Development fallback only. Always provide JWT_SECRET in a real deployment.
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef0123456789abcdef}
    issuer: women-safety-platform
    access-token-ttl: PT2H
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  storage:
    evidence-dir: ${EVIDENCE_DIR:./data/evidence}
  privacy:
    display-time-zone: ${DISPLAY_TIME_ZONE:Asia/Kolkata}
  hotspot:
    # Local equirectangular projection centred on Noida (NIET campus area).
    reference-latitude: 28.5355
    cell-size-meters: 500
    window-days: 30
    top-k: 20
  security:
    rate-limit:
      login-per-minute: ${RATE_LIMIT_LOGIN:8}
      tracking-per-minute: ${RATE_LIMIT_TRACKING:15}
      report-per-minute: ${RATE_LIMIT_REPORT:8}
      sos-per-minute: ${RATE_LIMIT_SOS:6}
  demo:
    seed-enabled: ${SEED_ENABLED:false}
    demo-password: ${DEMO_PASSWORD:Demo@12345}
